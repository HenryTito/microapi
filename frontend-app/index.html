<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>microapi — Usuários</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <header class="cabecalho">
      <div class="marca">
        <h1>microapi</h1>
        <span class="separador" aria-hidden="true">/</span>
        <span class="secao">usuários</span>
      </div>
      <div class="indicador" id="indicador">
        <span class="ponto" id="ponto"></span>
        <span id="statusTexto">conectando</span>
      </div>
    </header>

    <main>
      <section class="painel formulario" aria-labelledby="tituloFormulario">
        <h2 id="tituloFormulario">Novo usuário</h2>

        <form id="formulario" novalidate>
          <input type="hidden" id="id" />

          <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" required placeholder="Maria Silva" autocomplete="off" />
          </div>

          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" required placeholder="maria@exemplo.com" autocomplete="off" />
          </div>

          <div class="campo">
            <label for="foto">Foto <span class="opcional">(opcional)</span></label>
            <input type="url" id="foto" placeholder="https://…" autocomplete="off" />
          </div>

          <div class="acoes">
            <button type="submit" id="botaoSalvar" class="primario">Salvar</button>
            <button type="button" id="botaoCancelar" class="secundario" hidden>Cancelar</button>
          </div>
        </form>
      </section>

      <section class="painel lista-painel" aria-labelledby="tituloLista">
        <div class="painel-topo">
          <h2 id="tituloLista">Usuários</h2>
          <span class="contador" id="contador">0</span>
        </div>

        <ul id="lista" class="lista"></ul>

        <div id="carregando" class="esqueleto" aria-hidden="true">
          <div class="linha"></div>
          <div class="linha"></div>
          <div class="linha"></div>
        </div>

        <div id="vazio" class="estado" hidden>
          <p>Nenhum usuário cadastrado.</p>
          <p class="dica">Use o formulário ao lado para criar o primeiro.</p>
        </div>

        <div id="falha" class="estado erro" hidden>
          <p>Não foi possível falar com a API.</p>
          <p class="dica" id="falhaDetalhe"></p>
          <button type="button" class="secundario" id="botaoTentar">Tentar de novo</button>
        </div>
      </section>
    </main>

    <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
